# =============================================================================
# DataMind AI - local infrastructure
# Optional: the app also runs with SQLite + local filesystem storage if you
# don't want to use Docker. See README.md.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: datamind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamind}
      POSTGRES_DB: ${POSTGRES_DB:-datamind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datamind_pgdata:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: datamind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datamind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datamind-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - datamind_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional DB admin UI: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: datamind-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@datamind.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  datamind_pgdata:
  datamind_miniodata:
